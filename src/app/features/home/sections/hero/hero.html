<section id="hero" class="relative overflow-hidden bg-brand-dark text-white" aria-label="Presentación" (mouseenter)="pause()" (mouseleave)="resume()">
  <div class="relative">
    @for (slide of slides; track slide.title; let i = $index) {
      @if (current() === i) {
      <div class="relative">
        <img [src]="slide.image" [alt]="slide.eyebrow + ' - ' + slide.title" [loading]="i === 0 ? 'eager' : 'lazy'" [attr.fetchpriority]="i === 0 ? 'high' : null" class="h-[78vh] w-full animate-kenburns object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/40 to-black/20"></div>
        <div class="absolute inset-0 flex flex-col items-center justify-center px-4 text-center">
          <p class="animate-fade-up rounded-full bg-white/15 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-white backdrop-blur">{{ slide.eyebrow }}</p>
          <h1 class="font-display mt-4 max-w-3xl animate-fade-up text-4xl font-bold drop-shadow-lg md:text-6xl">{{ slide.title }}</h1>
          <div class="mt-6 flex animate-fade-up gap-3">
            <a [href]="slide.ctaLink" target="_blank" rel="noopener" class="rounded-full bg-brand-accent px-8 py-3 font-semibold text-white shadow-lg transition hover:scale-105 hover:bg-brand-accent-dark">{{ slide.cta }}</a>
            <a routerLink="/about" class="rounded-full border border-white/60 px-8 py-3 font-semibold text-white backdrop-blur transition hover:bg-white hover:text-brand-dark">Ver más</a>
          </div>
        </div>
      </div>
      }
    }
  </div>
  <div class="absolute inset-x-0 bottom-5 flex flex-col items-center gap-2">
    <div class="flex items-center gap-3">
      <button type="button" (click)="prev()" aria-label="Anterior" class="rounded-full bg-white/20 px-4 py-2 text-lg font-bold backdrop-blur transition hover:bg-white/50">‹</button>
      @for (slide of slides; track slide.title; let i = $index) {
        <button type="button" (click)="go(i)" [attr.aria-label]="'Ir a slide ' + (i + 1)" class="h-2.5 rounded-full transition-all" [class.w-8]="current() === i" [class.w-2.5]="current() !== i" [class.bg-white]="current() === i" [class.bg-white/40]="current() !== i"></button>
      }
      <button type="button" (click)="next()" aria-label="Siguiente" class="rounded-full bg-white/20 px-4 py-2 text-lg font-bold backdrop-blur transition hover:bg-white/50">›</button>
    </div>
    <div class="h-0.5 w-40 overflow-hidden rounded bg-white/20">
      <div class="h-full animate-progress bg-white"></div>
    </div>
  </div>
</section>
